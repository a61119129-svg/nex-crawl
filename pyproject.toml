[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexcrawl"
version = "0.1.0"
description = "A powerful Python web scraper — crawl, scrape, and extract structured data from any website."
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "NexCrawl Team"}
]
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "markdownify>=0.13",
    "readability-lxml>=0.8",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.0",
    "playwright>=1.48",
    "tenacity>=9.0",
    "click>=8.1",
    "rich>=13.0",
    "aiolimiter>=1.1",
    "urllib3>=2.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy"]

[project.scripts]
nexcrawl = "nexcrawl.cli:cli"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.setuptools.packages.find]
include = ["nexcrawl*"]
